name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: PYTHONDONTWRITEBYTECODE=1 COMMUTE_ENVIRONMENT=test python3 -m unittest discover backend/tests -v
      - name: Browser-domain tests
        run: node --test app/*.test.js
